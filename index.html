
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f2f4f8;
        }

        .navbar {
            background-color: #183153;
            padding: 15px;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #dbeafe;
        }

        .nav-tabs {
            background-color: white;
            padding: 10px;
        }

        .contenido {
            margin-top: 35px;
        }

        .list-group {
            border-radius: 12px;
            overflow: hidden;
        }

        .list-group-item {
            padding: 18px;
        }

        .carrusel-contenedor {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        .carousel img {
            height: 380px;
            object-fit: cover;
        }

        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        .botones .btn {
            min-width: 130px;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .colapsables {
            margin-top: 40px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        .colapsables .btn {
            margin: 10px;
            border-radius: 10px;
        }

        .collapse-contenido {
            margin: 15px auto;
            max-width: 500px;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/mi_primerapagweb/index.html">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlNBBoH9aMJBkv8cJoph48W3A5lPxLCN8x3Ua96sWV_Q&s=10"
                alt="Logo" width="40" height="35"
                class="d-inline-block align-middle me-2">

                INSTITUTO TECNOLÓGICO SUPERIOR QUITO
            </a>
        </div>
    </nav>
</header>

<!-- MENÚ -->
<nav class="nav nav-tabs">
    <a class="nav-link active" href="/mi_primerapagweb/servicios.html">Servicios</a>

    <a class="nav-link" href="/mi_primerapagweb/deber.html">Información</a>

    <a class="nav-link" href="/mi_primerapagweb/auxilio.html">Desarrollo</a>

    <a class="nav-link disabled">Disabled</a>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<main class="container contenido">

    <div class="row g-4">

        <!-- OPCIONES LATERALES -->
        <div class="col-md-4">

            <h4 class="mb-3">Menú de opciones</h4>

            <div class="list-group">

                <a class="list-group-item list-group-item-action"
                href="/mi_primerapagweb/deber.html">
                    Opción 1
                </a>

                <a class="list-group-item list-group-item-action"
                href="/mi_primerapagweb/auxilio.html">
                    Opción 2
                </a>

                <a class="list-group-item list-group-item-action"
                href="/mi_primerapagweb/servicios.html">
                    Opción 3
                </a>

                <a class="list-group-item list-group-item-action"
                href="/mi_primerapagweb/index.html">
                    Opción 4
                </a>

            </div>

        </div>

        <!-- CARRUSEL Y BOTONES -->
        <div class="col-md-8">

            <div class="carrusel-contenedor">

                <div id="carouselExampleFade"
                class="carousel carousel-fade slide"
                data-bs-ride="carousel">

                    <div class="carousel-inner">

                        <div class="carousel-item active">
                            <img src="https://static.wikia.nocookie.net/gatopedia/images/2/2e/El_gatoo.png/revision/latest/thumbnail/width/360/height/360?cb=20230103150310&path-prefix=es"
                            class="d-block w-100 rounded-3"
                            alt="Gato 1">
                        </div>

                        <div class="carousel-item">
                            <img src="https://i.redd.it/n9dleoj8dgfc1.jpg"
                            class="d-block w-100 rounded-3"
                            alt="Gato 2">
                        </div>

                        <div class="carousel-item">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMATM5PK1xmkqG_f5E83Tmts9pcXR2JjQAuiPrnZuFv9xkne-M147zTmM&s=10"
                            class="d-block w-100 rounded-3"
                            alt="Gato 3">
                        </div>

                    </div>

                    <!-- FLECHAS -->
                    <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselExampleFade"
                    data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>

                    </button>

                    <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExampleFade"
                    data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>

                    </button>

                </div>

                <!-- BOTONES -->
                <div class="botones">

                    <button type="button"
                    class="btn btn-warning"            
                    onclick="amarillo()">

                        CUIDADOOOO
                    </button>

                    <button type="button"
                    class="btn btn-primary"
                    onclick="saludar()">
                        MIRA
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- BOTONES COLAPSABLES -->
    <section class="colapsables">

        <h4>cuidado si clickeas colapsas o.o </h4>

        <!-- COLAPSAR VERTICAL -->
        <button class="btn btn-primary"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapseExample">

            Colapsar

        </button>

        <div class="collapse collapse-contenido"
        id="collapseExample">

            <div class="card card-body">
                ¡Así es! Acabas de colapsar 
            </div>

        </div>

        <!-- COLAPSAR HORIZONTAL -->
        <button class="btn btn-success"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapseWidthExample">

            Colapsar a la derecha

        </button>

        <div class="collapse collapse-horizontal collapse-contenido"
        id="collapseWidthExample">

            <div class="card card-body"
            style="width: 300px;">

                ¡Ahora viste cómo colapsa hacia la derecha! OMG

            </div>

        </div>

    </section>

</main>

<!-- FUNCIÓN JAVASCRIPT -->

    function saludar() {
        alert("mira son gatos omg");
    }
</script>
<script>
    function amarillo() {
        alert("por que cliclckeas si te dice cuidado???");
    }

</script>

</body>
</html>
